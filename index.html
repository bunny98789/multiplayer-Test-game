<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FREE MULTIPLAYER SHOOTER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding-top: 20px;
            user-select: none;
        }

        h1 {
            margin: 0 0 15px 0;
        }

        #connection-panel {
            margin-bottom: 15px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            width: 280px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            filter: brightness(1.15);
        }

        canvas {
            background-color: #222;
            border: 3px solid #444;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            cursor: crosshair;
        }

        #status {
            margin-top: 10px;
            color: #aaa;
        }

        /*
         * GAME HUD
         */

        #hud {
            width: 600px;
            margin: 10px auto 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 18px;
            font-weight: bold;
        }

        #health {
            color: #ff5555;
        }

        #ammo {
            color: #ffd84d;
        }

        #round {
            color: #66aaff;
        }

        #instructions {
            margin-top: 10px;
            color: #999;
            font-size: 14px;
        }

        #game-wrapper {
    position: relative;
    width: 600px;
    height: 400px;
    margin: 0 auto;
}

#game-wrapper canvas {
    position: absolute;
    left: 0;
    top: 0;
}

#reload {
    position: absolute;

    left: 0;
    top: 50%;

    width: 100%;

    transform: translateY(-50%);

    text-align: center;

    color: #ffaa44;

    font-size: 24px;
    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

    display: none;

    pointer-events: none;

    z-index: 10;
}

    /* ========================================
   LOBBY
======================================== */

#roomMenu {
    width: 360px;
    margin: 60px auto 30px auto;
    padding: 30px;
    box-sizing: border-box;

    background: #151515;
    border: 2px solid #333;
    border-radius: 12px;

    text-align: center;

    box-shadow:
        0 0 20px rgba(0, 0, 0, 0.6);
}

#roomMenu::before {
    content: "MULTIPLAYER LOBBY";

    display: block;

    color: white;
    font-size: 28px;
    font-weight: bold;

    margin-bottom: 8px;
}

#roomMenu::after {
    content: "Create a room or join a friend";

    display: block;

    color: #888;
    font-size: 14px;

    margin-bottom: 25px;
}

#roomMenu input {
    width: 100%;
    box-sizing: border-box;

    padding: 12px;

    margin-bottom: 12px;

    background: #222;
    color: white;

    border: 1px solid #444;
    border-radius: 6px;

    font-size: 16px;

    outline: none;
}

#roomMenu input:focus {
    border-color: #007bff;
}

#roomMenu button {
    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    border: none;
    border-radius: 6px;

    background: #007bff;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.15s,
        transform 0.1s;
}

#roomMenu button:hover {
    background: #0066d6;
}

#roomMenu button:active {
    transform: scale(0.98);
}

#roomDisplay {
    color: #66ff66;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

#roomError {
    color: #ff5555;
    font-size: 14px;
    min-height: 20px;
}
    </style>
</head>

<body>

<h1>FREE MULTIPLAYER SHOOTER</h1>

<div id="connection-panel">

    <input
        type="text"
        id="server-url"
        value="https://multiplayer-test-game-production.up.railway.app"
        placeholder="Server URL"
    >

    <button id="connect-btn">
        Connect to Server
    </button>

    <div id="status">
        Not connected
    </div>

</div>


<!-- GAME HUD -->

<div id="hud">

    <div id="health">
        ❤️ 100 HP
    </div>

    <div id="round">
        ROUND 1 / 5
    </div>

    <div id="ammo">
        🔫 6 / 6
    </div>

</div>

    <div id="roomMenu">

    <input
        id="usernameInput"
        placeholder="Username"
        maxlength="16"
    >

    <br><br>

    <button id="createRoomButton">
        Create Room
    </button>

    <br><br>

    <input
        id="roomInput"
        placeholder="Room Code"
        maxlength="8"
    >

    <button id="joinRoomButton">
        Join Room
    </button>

    <p id="roomDisplay"></p>

    <p id="roomError"></p>

</div>


<div id="game-wrapper">
    
    <canvas
        id="gameCanvas"
        width="600"
        height="400">
    </canvas>

    <div id="reload">
        RELOADING...
    </div>

</div>

<div id="instructions">
    WASD / Arrow Keys = Move &nbsp; | &nbsp;
    Mouse = Aim &nbsp; | &nbsp;
    Left Click = Shoot &nbsp; | &nbsp;
    R = Reload
</div>


<!--
    SOCKET.IO CLIENT

    IMPORTANT:
    This MUST load BEFORE the game JavaScript below.
-->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


<script>

    /*
     * =========================
     * ELEMENTS
     * =========================
     */

    const canvas =
        document.getElementById("gameCanvas");

    const ctx =
        canvas.getContext("2d");

    const connectBtn =
        document.getElementById("connect-btn");

    const serverUrlInput =
        document.getElementById("server-url");

    const statusText =
        document.getElementById("status");

    const healthText =
        document.getElementById("health");

    const ammoText =
        document.getElementById("ammo");

    const roundText =
        document.getElementById("round");

    const reloadText =
        document.getElementById("reload");


    const usernameInput =
    document.getElementById("usernameInput");

const createRoomButton =
    document.getElementById("createRoomButton");

const joinRoomButton =
    document.getElementById("joinRoomButton");

const roomInput =
    document.getElementById("roomInput");

const roomDisplay =
    document.getElementById("roomDisplay");

const roomError =
    document.getElementById("roomError");

    /*
     * =========================
     * GAME VARIABLES
     * =========================
     */

    let socket = null;

    let players = {};
    let bullets = {};

    let myPlayerId = null;

    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;

    let myAngle = 0;

    const speed = 8;
    
    let shooting = false;

    createRoomButton.addEventListener(
    "click",
    () => {

        if (!socket || !socket.connected) {
            return;
        }

        const username =
            usernameInput.value.trim();

        if (!username) {
            roomError.innerText =
                "Enter a username first.";

            return;
        }

        socket.emit(
            "createRoom",
            username
        );

    }
);


joinRoomButton.addEventListener(
    "click",
    () => {

        if (!socket || !socket.connected) {
            return;
        }

        const username =
            usernameInput.value.trim();

        const roomCode =
            roomInput.value.trim();

        if (!username) {

            roomError.innerText =
                "Enter a username first.";

            return;

        }

        if (!roomCode) {

            roomError.innerText =
                "Enter a room code.";

            return;

        }


        socket.emit(
            "joinRoom",
            {
                username: username,
                roomCode: roomCode
            }
        );

    }
);



    /*
     * =========================
     * CONNECTION
     * =========================
     */

    function connectToServer() {

        if (typeof io === "undefined") {

            console.error(
                "Socket.io failed to load."
            );

            statusText.innerText =
                "ERROR: Socket.io library failed to load.";

            statusText.style.color =
                "red";

            return;
        }


        if (socket) {
            socket.disconnect();
        }


        const url =
            serverUrlInput.value.trim();


        console.log(
            "Connecting to:",
            url
        );


        statusText.innerText =
            "Connecting...";

        statusText.style.color =
            "yellow";


        connectBtn.innerText =
            "Connecting...";

        connectBtn.style.backgroundColor =
            "#b8860b";


        socket = io(url);


        /*
         * CONNECTED
         */

        socket.on("connect", () => {

            console.log(
                "Connected!",
                socket.id
            );

            myPlayerId =
                socket.id;


            connectBtn.innerText =
                "Connected!";

            connectBtn.style.backgroundColor =
                "green";


            statusText.innerText =
                "Connected as " + socket.id;

            statusText.style.color =
                "lightgreen";
        });


        /*
         * DISCONNECTED
         */

        socket.on("disconnect", (reason) => {

            console.log(
                "Disconnected:",
                reason
            );


            myPlayerId = null;


            connectBtn.innerText =
                "Connect to Server";

            connectBtn.style.backgroundColor =
                "#007bff";


            statusText.innerText =
                "Disconnected: " + reason;

            statusText.style.color =
                "orange";
        });


        /*
         * CONNECTION ERROR
         */

        socket.on(
            "connect_error",
            (error) => {

                console.error(
                    "Connection error:",
                    error
                );


                connectBtn.innerText =
                    "Connection Failed";

                connectBtn.style.backgroundColor =
                    "red";


                statusText.innerText =
                    "Connection error: " +
                    error.message;

                statusText.style.color =
                    "red";
            }
        );

// =========================
// ROOM JOINED
// =========================

socket.on("roomJoined", (data) => {

    roomDisplay.innerText =
        "Room: " + data.roomCode;

    roomError.innerText = "";

    console.log(
        "Joined room:",
        data.roomCode
    );

});


// =========================
// ROOM ERROR
// =========================

socket.on("roomError", (message) => {

    roomError.innerText =
        message;

});


        /*
         * PLAYER / GAME STATE
         */

        socket.on(
            "updatePlayers",
            (newPlayers) => {

                players =
                    newPlayers;

                drawGame();
                updateHUD();
            }
        );

        socket.on("updateBullets", (newBullets) => {
            bullets = newBullets;
            drawGame();
        });

    }


    /*
     * =========================
     * MOUSE AIMING
     * =========================
     */

    canvas.addEventListener(
        "mousemove",
        (e) => {

            const rect =
                canvas.getBoundingClientRect();


            mouseX =
                e.clientX - rect.left;

            mouseY =
                e.clientY - rect.top;


            updateAim();
        }
    );


    function updateAim() {

    if (
        !myPlayerId ||
        !players[myPlayerId]
    ) {
        return;
    }

    const player =
        players[myPlayerId];

    myAngle =
        Math.atan2(
            mouseY - player.y,
            mouseX - player.x
        );

    /*
     * Update our local player immediately
     * so aiming feels instant.
     */

    player.angle = myAngle;

    /*
     * Tell the server too.
     */

    if (
        socket &&
        socket.connected
    ) {
        socket.emit(
            "aim",
            {
                angle: myAngle
            }
        );
    }

    drawGame();
}

    /*
     * =========================
     * SHOOTING
     * =========================
     */

    canvas.addEventListener(
        "mousedown",
        (e) => {

            if (e.button !== 0) {
                return;
            }


            shooting = true;


            shoot();
        }
    );


    window.addEventListener(
        "mouseup",
        (e) => {

            if (e.button === 0) {
                shooting = false;
            }
        }
    );


    function shoot() {

        if (
            !socket ||
            !socket.connected
        ) {
            return;
        }


        socket.emit("shoot");
    }


    /*
     * =========================
     * RELOADING
     * =========================
     */

    window.addEventListener(
        "keydown",
        (e) => {

            if (
                e.key.toLowerCase() === "r"
            ) {

                if (
                    socket &&
                    socket.connected
                ) {

                    socket.emit(
                        "reload"
                    );
                }

                return;
            }

        }
    );


    /*
     * =========================
     * MOVEMENT
     * =========================
     */

    const keys = {};


    window.addEventListener(
        "keydown",
        (e) => {

            if (
             e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA"
            ) {
            return;
            }   

            const key =
                e.key.toLowerCase();


            if (
                [
                    "w",
                    "a",
                    "s",
                    "d",
                    "arrowup",
                    "arrowdown",
                    "arrowleft",
                    "arrowright"
                ].includes(key)
            ) {

                e.preventDefault();

                keys[key] = true;
            }
        }
    );


    window.addEventListener(
        "keyup",
        (e) => {

            keys[
                e.key.toLowerCase()
            ] = false;
        }
    );


    /*
     * Send movement continuously.
     *
     * This will make the controls much
     * smoother than the old keydown-only
     * system.
     */

    function movementLoop() {

    if (
        socket &&
        socket.connected &&
        myPlayerId &&
        players[myPlayerId]
    ) {

        let forward = 0;
        let strafe = 0;


        /*
         * FORWARD / BACKWARD
         */

        if (
            keys["w"] ||
            keys["arrowup"]
        ) {
            forward += 1;
        }

        if (
            keys["s"] ||
            keys["arrowdown"]
        ) {
            forward -= 1;
        }


        /*
         * LEFT / RIGHT STRAFE
         */

        if (
            keys["a"] ||
            keys["arrowleft"]
        ) {
            strafe -= 1;
        }

        if (
            keys["d"] ||
            keys["arrowright"]
        ) {
            strafe += 1;
        }


        /*
         * Convert forward/strafe movement
         * into X/Y using the player's angle.
         */

        if (
            forward !== 0 ||
            strafe !== 0
        ) {

            const angle = myAngle;


            let x =
                Math.cos(angle) * forward
                +
                Math.cos(angle + Math.PI / 2) * strafe;


            let y =
                Math.sin(angle) * forward
                +
                Math.sin(angle + Math.PI / 2) * strafe;


            /*
             * Normalize diagonal movement.
             */

            const length =
                Math.sqrt(
                    x * x + y * y
                );


            if (length > 0) {

                x /= length;
                y /= length;

            }


            socket.emit(
                "move",
                {
                    x: x * speed,
                    y: y * speed
                }
            );
        }
    }


    requestAnimationFrame(
        movementLoop
    );
}

    movementLoop();


    /*
     * =========================
     * DRAW GAME
     * =========================
     */

    function drawGame() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * Draw background grid.
         */

        ctx.strokeStyle =
            "#292929";

        ctx.lineWidth = 1;


        for (
            let x = 0;
            x <= canvas.width;
            x += 40
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x,
                0
            );

            ctx.lineTo(
                x,
                canvas.height
            );

            ctx.stroke();
        }


        for (
            let y = 0;
            y <= canvas.height;
            y += 40
        ) {

            ctx.beginPath();

            ctx.moveTo(
                0,
                y
            );

            ctx.lineTo(
                canvas.width,
                y
            );

            ctx.stroke();
        }


        /*
         * Draw players.
         */

        for (let id in players) {

    const player = players[id];

    if (!player) {
        continue;
    }

    // =========================
    // DEAD / RELOADING ALPHA
    // =========================

    if (player.dead) {
        ctx.globalAlpha = 0.25;
    } else if (player.reloading) {
        ctx.globalAlpha = 0.5;
    } else {
        ctx.globalAlpha = 1;
    }


    // =========================
    // PLAYER BODY
    // =========================

    ctx.fillStyle =
        player.color || "green";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // =========================
    // AIM / GUN
    // =========================

    const angle =
        player.angle || 0;

    const gunLength = 28;

    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        player.x +
            Math.cos(angle) * gunLength,

        player.y +
            Math.sin(angle) * gunLength
    );

    ctx.stroke();


    // =========================
    // PLAYER OUTLINE
    // =========================

    ctx.strokeStyle =
        id === myPlayerId
            ? "white"
            : "#777";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        20,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // =========================
    // DEAD PLAYER X
    // =========================

    if (player.dead) {

        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            player.x - 12,
            player.y - 12
        );

        ctx.lineTo(
            player.x + 12,
            player.y + 12
        );

        ctx.moveTo(
            player.x + 12,
            player.y - 12
        );

        ctx.lineTo(
            player.x - 12,
            player.y + 12
        );

        ctx.stroke();
    }

        // Username

ctx.globalAlpha = 1;

ctx.fillStyle = "white";

ctx.font = "bold 14px Arial";

ctx.textAlign = "center";

ctx.textBaseline = "bottom";

ctx.fillText(
    player.username,
    player.x,
    player.y - 25
);


    // =========================
    // RESET ALPHA
    // =========================

    ctx.globalAlpha = 1;
   
}

// =========================
// DRAW BULLETS
// =========================

for (const id in bullets) {

    const bullet = bullets[id];

    if (!bullet) {
        continue;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        bullet.x,
        bullet.y,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

}


    /*
     * =========================
     * HUD
     * =========================
     */

    function updateHUD() {

        if (
            !myPlayerId ||
            !players[myPlayerId]
        ) {
            return;
        }


        const player =
            players[myPlayerId];


        const health =
            player.health ?? 100;

        const ammo =
            player.ammo ?? 6;


        healthText.innerText =
            "❤️ " + health + " HP";


        ammoText.innerText =
            "🔫 " +
            ammo +
            " / 6";


        roundText.innerText =
            "ROUND " +
            (player.round ?? 1) +
            " / 5";


        if (player.reloading) {

            reloadText.style.display =
                "block";

        } else {

            reloadText.style.display =
                "none";
        }

    }


    /*
     * =========================
     * CONNECT BUTTON
     * =========================
     */

    connectBtn.addEventListener(
        "click",
        connectToServer
    );


    /*
     * =========================
     * START
     * =========================
     */

    connectToServer();

</script>

</body>
</html>
