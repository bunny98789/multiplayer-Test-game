<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FREE MULTIPLAYER SHOOTER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>FREE MULTIPLAYER SHOOTER</h1>

<div id="connection-panel">

    <input
        type="text"
        id="server-url"
        value="https://multiplayer-test-game-production.up.railway.app"
        placeholder="Server URL"
    >

    <button id="connect-btn">
        Connect to Server
    </button>

    <div id="status">
        Not connected
    </div>

</div>


<!-- GAME HUD -->

<div id="hud">

    <div id="health">
        ❤️ 100 HP
    </div>

    <div id="round">
        ROUND 1 / 5
    </div>

    <div id="ammo">
        🔫 6 / 6
    </div>

</div>

    <div id="roomMenu">

    <input
        id="usernameInput"
        placeholder="Username"
        maxlength="16"
    >

    <br><br>

    <button id="createRoomButton">
        Create Room
    </button>

    <br><br>

    <input
        id="roomInput"
        placeholder="Room Code"
        maxlength="8"
    >

    <button id="joinRoomButton">
        Join Room
    </button>

    <p id="roomDisplay"></p>

    <p id="roomError"></p>

</div>

    <div id="gameRoomInfo">
    Room: <span id="gameRoomCode">---</span>
</div>


<div id="game-wrapper">
    
    <canvas
        id="gameCanvas"
        width="600"
        height="400">
    </canvas>

    <div id="reload">
        RELOADING...
    </div>

</div>

<div id="instructions">
    WASD / Arrow Keys = Move &nbsp; | &nbsp;
    Mouse = Aim &nbsp; | &nbsp;
    Left Click = Shoot &nbsp; | &nbsp;
    R = Reload
</div>


<!--
    SOCKET.IO CLIENT

    IMPORTANT:
    This MUST load BEFORE the game JavaScript below.
-->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


<script src="game.js"></script>

</body>
</html>
